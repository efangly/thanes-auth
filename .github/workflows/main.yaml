name: Docker Image CI

on:
  push:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: siamatic/smtrack-auth-service:3.0.0
      # The Kubernetes manifests live in a separate GitOps repository; this job
      # rewrites the image tag there after a successful push.
      # Needs the repository secret GITOPS_TOKEN: a token with contents:write
      # on that repository (fine-grained PAT or GitHub App token). The default
      # GITHUB_TOKEN cannot push to another repository.
      GITOPS_REPO: "efangly/thanes-auth"
      # Directory inside the GitOps repository that holds this service's
      # manifests; Argo CD syncs it (argocd/application.yaml there).
      GITOPS_PATH: "thanes-auth"
    steps:
    - uses: actions/checkout@v4
    # The image is only built and pushed (and the GitOps manifests only
    # rewritten) once these pass.
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Vet
      run: go vet ./...
    - name: Check formatting
      run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
    - name: Test
      run: go test ./...
    # Fail before anything is pushed if the manifests could not be updated
    # afterwards.
    - name: Check GitOps settings
      env:
        GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
      run: |
        if [ -z "$GITOPS_REPO" ]; then
          echo "::error::GITOPS_REPO is not set in .github/workflows/main.yaml"
          exit 1
        fi
        if [ -z "$GITOPS_TOKEN" ]; then
          echo "::error::Repository secret GITOPS_TOKEN is not set"
          exit 1
        fi
    - name: Login to docker hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ env.IMAGE_NAME }}
    - name: Check out GitOps repository
      uses: actions/checkout@v4
      with:
        repository: ${{ env.GITOPS_REPO }}
        token: ${{ secrets.GITOPS_TOKEN }}
        path: gitops
    - name: Update Kubernetes manifests with new image
      working-directory: gitops/${{ env.GITOPS_PATH }}
      run: |
        # deploy.yaml (the old hospital/ward version, ADR 0004) is left alone.
        files="deploy-v2.yaml purge-cronjob.yaml import-legacy-job.yaml"
        sed -i "s|image: .*|image: ${{ env.IMAGE_NAME }}|" $files
        git config user.name "FangLy"
        git config user.email "thefangsni@gmail.com"
        git add $files
        # Re-pushing an existing tag changes nothing; that is not an error.
        if git diff --cached --quiet; then
          echo "Manifests already at ${{ env.IMAGE_NAME }}"
          exit 0
        fi
        git commit -m "auth: ${{ env.IMAGE_NAME }}" -m "From ${{ github.repository }}@${{ github.sha }}"
        git push
    # Reports failures too (always()), so a broken build is not silent.
    # Needs the repository secrets TELEGRAM_BOT_TOKEN (from @BotFather) and
    # TELEGRAM_CHAT_ID (the chat or group the bot posts to).
    - name: Send result to Telegram
      if: always()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TEXT: "GitHub Action build ${{ env.IMAGE_NAME }} result: ${{ job.status }} 🖕🖕🖕🖕"
      run: |
        if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
          echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not set; no notification sent"
          exit 0
        fi
        curl -sS -f -o /dev/null \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
          --data-urlencode "text=${TEXT}"
